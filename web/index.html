<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seoul 2033 Help</title>
  <link rel="stylesheet" href="./styles.css?v=14" />
</head>
<body>
  <header class="app-bar">
    <h1>Seoul 2033 Help</h1>
    <p>인카운터 이름이나 선택지 문구로 검색하면 결과를 바로 볼 수 있습니다.</p>
  </header>

  <div id="error" class="error-banner" hidden></div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="인카운터·선택지 검색" autocomplete="off" />
    <label class="toggle">
      <input id="recommend" type="checkbox" checked />
      추천 강조
    </label>
  </div>

  <div class="layout">
    <nav class="list-pane" aria-label="검색 결과">
      <ul id="list"></ul>
    </nav>
    <main class="detail-pane" id="detail">
      <p class="empty">왼쪽에서 인카운터를 고르세요</p>
    </main>
  </div>

  <script src="./encounters.data.js?v=14"></script>
  <script src="./normalize.js?v=14"></script>
  <script src="./effects.js?v=14"></script>
  <script src="./app.js?v=14"></script>
</body>
</html>
